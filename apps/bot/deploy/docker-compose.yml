name: siksamitra-bot

# Source: github.com/marin-hrvacanin/siksamitra (public), branch `bot`, checked out in ./src.
# Built on this box by deploy-git-apps whenever that branch moves (checked every minute).
# The bot polls Telegram, so nothing is published and Caddy has no site for it.
services:
  bot:
    build:
      context: ./src
      dockerfile: apps/bot/Dockerfile
    image: siksamitra-bot:latest
    pull_policy: never          # local image; keeps update-apps from trying a registry
    container_name: siksamitra-bot
    restart: unless-stopped
    stop_grace_period: 5m       # an update lets a request in flight finish and answer first
    env_file: [.env]            # DEEPSEEK_API_KEY, TELEGRAM_BOT_TOKEN, BOT_ALLOWED_USERS, BOT_OWNERS, limits
    volumes:
      - ./data:/data            # the spending ledger and each chat's session
      - ./fonts:/app/fonts:ro   # his fonts, which the PDF printer reads (never in the image or the repository)
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 1g
    networks: [outbound, search]

networks:
  outbound: {}                  # its own: the internet, and no other container
  search: { external: true }    # SearXNG's, which only the bot joins (/srv/apps/searxng)
