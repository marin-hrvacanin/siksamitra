<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    THE DOCUMENT ICON — what a `.smdoc` looks like in a file manager.

    A different thing from the application icon, and it has to read as one at
    16px in a list: a SHEET, so the eye knows it is a file, carrying the
    program's own mark so it knows whose. The app icon is the bronze `श` with
    no sheet; putting the same picture on both would make a folder of
    documents look like a folder of copies of the program.

    The marks on the sheet are the two holdings — thin and thick — because
    that is what the file contains and what this program is for.
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f2ee"/>
    </linearGradient>
  </defs>

  <!-- The sheet, with a folded corner. Drawn, not shaded: a flat mark stays
       legible at 16px, where a gradient becomes mud. -->
  <path d="M96 40h216l104 104v328a24 24 0 0 1-24 24H96a24 24 0 0 1-24-24V64a24 24 0 0 1 24-24z"
        fill="url(#page)" stroke="#c9c4bb" stroke-width="8" stroke-linejoin="round"/>
  <path d="M312 40l104 104H336a24 24 0 0 1-24-24z" fill="#e6e1d8" stroke="#c9c4bb"
        stroke-width="8" stroke-linejoin="round"/>

  <!-- The program's own letter, in its bronze. -->
  <text x="244" y="330" font-family="Nirmala UI, Noto Serif Devanagari, serif"
        font-size="210" text-anchor="middle" fill="#b8813d">श</text>

  <!-- The two holdings: the short box thin, the long box thick. The only
       difference between them is the stroke weight, on the page and here. -->
  <rect x="140" y="368" width="92" height="46" rx="6" fill="none"
        stroke="#538135" stroke-width="8"/>
  <rect x="256" y="368" width="92" height="46" rx="6" fill="none"
        stroke="#538135" stroke-width="18"/>
</svg>
