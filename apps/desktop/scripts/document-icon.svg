<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="a śikṣāmitra document">
  <!--
    THE DOCUMENT ICON — what one of this program's files looks like in a file
    manager.

    A different thing from the application icon and it has to read as one at
    16px in a list: a SHEET, so the eye knows it is a file, carrying the
    program's mark so it knows whose. Putting the app icon on both would make a
    folder of documents look like a folder of copies of the program.

    It shares the application icon's palette and its mark — the circle and the
    sweep — because the two are the same family and were not: this used to set
    `श` in Nirmala UI over a grey sheet with two green rectangles, which shared
    nothing with the app icon but the fact that somebody drew both.

    NO GRADIENT ON THE SHEET. There was one, and at 16px a gradient is mud. The
    fold is drawn as a darker flat shape instead, which is what makes a sheet
    read as a sheet at any size.
  -->

  <!-- The sheet, with a folded corner. -->
  <path d="M96 40h216l104 104v328a24 24 0 0 1-24 24H96a24 24 0 0 1-24-24V64a24 24 0 0 1 24-24z"
        fill="#fdfaf3" stroke="#d8cfbd" stroke-width="8" stroke-linejoin="round"/>
  <path d="M312 40l104 104H336a24 24 0 0 1-24-24z"
        fill="#eee5d3" stroke="#d8cfbd" stroke-width="8" stroke-linejoin="round"/>

  <!-- The mark, smaller and set into the sheet: the same circle and sweep the
       application wears, so a file and the program that opens it look related. -->
  <circle cx="196" cy="236" r="34" fill="#c8781f"/>
  <path fill="#d98b2b" d="
    M 112 322
    C 176 282, 264 272, 364 250
    C 340 304, 289 348, 233 366
    C 185 381, 140 362, 112 322
    Z"/>
</svg>
