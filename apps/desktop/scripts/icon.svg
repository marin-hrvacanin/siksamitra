<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The program's own mark: `श`, the first letter of śikṣā, on the bronze
       accent. Not a document sheet and not a gradient — an identity. -->
  <rect width="512" height="512" rx="96" fill="#f2f2f5"/>
  <rect x="26" y="26" width="460" height="460" rx="74" fill="#ffffff"/>
  <text x="256" y="366" font-family="Nirmala UI, Noto Serif Devanagari, serif"
        font-size="330" text-anchor="middle" fill="#b8813d">श</text>
  <!-- A short and a long holding box, the marks the program exists to draw. -->
  <rect x="150" y="404" width="86" height="40" rx="5" fill="none" stroke="#10b981" stroke-width="9"/>
  <rect x="272" y="404" width="86" height="40" rx="5" fill="none" stroke="#10b981" stroke-width="17"/>
</svg>
