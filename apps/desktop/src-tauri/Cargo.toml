[package]
name = "siksamitra-desktop"
version = "2.0.0-alpha.0"
description = "The siksamitra desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "siksamitra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A smaller binary matters here: the installer is what a non-technical person
# downloads, and the fonts already account for 8 MB of it.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
