<!doctype html>
<meta charset="utf-8">
<title>lexical spike</title>
<style>
  @font-face {
    font-family: "Noto Serif Devanagari";
    src: url("./noto-serif-devanagari-devanagari-400-normal.woff2") format("woff2");
    font-display: block;
  }
  body { font-family: "Gentium Book Plus", "Noto Serif Devanagari", serif; font-size: 40px; padding: 40px; }
  #editor { outline: none; min-height: 2em; }
  .run { display: inline; }
  
  .hold { display: inline-block; line-height: 1; position: relative; }
  .hold::before {
    content: ''; position: absolute; inset: -0.1em -0.07em -0.12em;
    border-radius: 3px; box-shadow: inset 0 0 0 2px #10b981; pointer-events: none;
  }
</style>
